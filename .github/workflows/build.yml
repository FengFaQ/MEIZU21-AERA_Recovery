name: AERA Recovery for Meizu 21 (m2461)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'device/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  # Cancel an in-flight build when a newer commit is pushed: a build that is
  # still syncing on stale workflow code is pure waste (and its 350 min budget
  # would block the queue).
  group: aera-m2461-${{ github.ref }}
  cancel-in-progress: true

env:
  MANIFEST_URL: https://github.com/FengFaQ/MEIZU21-AERA_Recovery
  MANIFEST_BRANCH: main
  LUNCH_TARGET: twrp_m2461-bp2a-eng
  DEVICE_DIR: device/meizu/m2461
  SRC: /build/source
  MONO: /build/mono
  SYNC_JOBS: '4'

jobs:
  build:
    name: Sync AERA 16.0 and build recovery.img
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # ---------------------------------------------------------------- space
      # Nine runs of ENOSPC chasing condensed into one lesson: do not put the
      # build tree on top of a loop-backed LVM volume.
      #
      # maximize-build-space fallocates /pv.img inside /, then mounts a
      # filesystem made from it on /build. Every write to /build grows pv.img,
      # which consumes the very filesystem pv.img lives in. The mount happily
      # reports 90 GB free (that is the LVM size) while writes hit the wall as
      # soon as pv.img cannot grow any further inside /. That is why run #9 and
      # run #10 could not write a single project object with df showing 90 GB
      # free and 25 M inodes free, and why a 40 GB dd test still passed while
      # a real AOSP tree (409 projects, tens of GB, millions of files) did not.
      #
      # The runner's own / volume is already 145 GB with ~100 GB free, which is
      # plenty for a recovery-only AOSP tree. Build directly on / and skip the
      # LVM indirection entirely; only delete the fat preinstalled toolchains
      # to buy back a few more GB.
      - name: Free disk space on the native filesystem
        run: |
          echo "=== before ==="
          df -h /
          df -i /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/share/swift /usr/lib/jvm /usr/local/aws-cli \
                      /usr/local/aws /opt/microsoft /usr/local/.ghcup \
                      /opt/az /usr/share/miniconda /usr/local/go \
                      /usr/lib/mono /usr/lib/R || true
          sudo docker system prune --all --force --volumes || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          echo "=== after ==="
          df -h /
          df -i /

      - name: Report disk and memory
        run: |
          df -h /
          df -i /
          df -h /mnt || true
          free -h
          echo "cpus: $(nproc)"

      # Every heavy path now lives under /build on the native root filesystem,
      # which the runner user cannot create at the top level by itself.
      - name: Point every heavy path at the big volume
        run: |
          sudo mkdir -p /build
          sudo chown "$(id -u):$(id -g)" /build
          mkdir -p /build/{tmp,home,mono,source}
          {
            echo "TMPDIR=/build/tmp"
            echo "TMP=/build/tmp"
            echo "TEMP=/build/tmp"
            echo "HOME=/build/home"
          } >> "$GITHUB_ENV"
          ls -ld /build
          df -h /

      # ------------------------------------------------------------ toolchain
      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 unzip xz-utils lz4 rsync
          curl -sSL -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod a+x /usr/local/bin/repo
          git config --global user.name "AERA CI"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global color.ui false
          echo "HOME=$HOME TMPDIR=$TMPDIR"
          df -h /
          repo --version

      # ------------------------------------------------------------ monorepo
      # The monorepo carries the manifest, the three consolidated AERA trees
      # and the device tree. ~420 MB, so move it off the small root fs onto
      # the big /build volume right away.
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          path: mono-checkout

      - name: Relocate monorepo onto the big volume
        run: |
          mkdir -p "$MONO"
          cp -a "$GITHUB_WORKSPACE/mono-checkout/." "$MONO/"
          rm -rf "$GITHUB_WORKSPACE/mono-checkout"
          du -sh "$MONO"
          df -h / | tail -1

      # -------------------------------------------------------------- source
      # Partial clone keeps .repo small: blobs above 10 MB are fetched on
      # demand instead of being packed into the object store up front.
      # No --partial-clone: the AOSP 16 manifest in this tree already pins
      # clone-depth="1" on ~100 projects (prebuilts/*, kernel/prebuilts/*,
      # packages/modules/ArtPrebuilt, ...). Combining a blob filter with
      # shallow clones makes repo fail while materialising the work tree -
      # run #6 and #7 both died instantly with
      #   error.GitError: Cannot checkout platform/prebuilts/rust:
      #                  Cannot initialize work tree for platform/prebuilts/rust
      # and /build never grew past 1.3 GB, i.e. nothing was ever downloaded.
      # The manifest's own clone-depth already bounds the on-disk size.
      - name: repo init
        run: |
          mkdir -p "$SRC"
          cd "$SRC"
          repo init --no-clone-bundle \
            -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"

      # bootable/recovery, external/lvgl and vendor/recovery ship inside the
      # monorepo (see the overlay step), so repo must not fetch them.
      #
      # Pruning is done with -g/-x groups on the sync, NOT with a
      # remove-project list: run #13 proved that naming a project that an
      # earlier manifest layer already removed is a hard error
      #   "remove-project element specifies non-existent project: platform/cts"
      # Group selection is declarative and cannot reference a missing project.
      - name: Local manifest - skip AERA repos shipped in the monorepo
        run: |
          cd "$SRC"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/00-meizu21.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remove-project name="android_bootable_recovery" />
            <remove-project name="android_external_lvgl" />
            <remove-project name="android_vendor_recovery" />
          </manifest>
          XML
          ls -la .repo/local_manifests
          echo "--- projects visible to repo ---"
          repo list 2>/dev/null | wc -l
          # keep copies outside .repo: a repo init fallback re-creates .repo
          mkdir -p /tmp/localmanifests
          cp -f .repo/local_manifests/*.xml /tmp/localmanifests/

      # Group exclusion instead of a remove-project list.
      #
      # Run #13 showed why an explicit prune manifest is fragile: naming a
      # project that an earlier manifest layer already removed is a hard error
      #   remove-project element specifies non-existent project: platform/cts
      # Group filters are declarative, so excluding a group whose members
      # happen to be gone already is harmless. Everything the build needs is
      # in the default/pdk families, so exclude the test, desktop and
      # non-Linux groups plus the per-device ones.
      # Prune by building the remove-project list from repo's OWN project list.
      #
      # Three attempts failed because the pruning was guessed:
      #   #13  remove-project named platform/cts, already removed upstream
      #        -> "remove-project element specifies non-existent project"
      #   #14  five separate -x flags -> argparse keeps only the last
      #   #15  this repo has no -x at all ("no such option: -x")
      #   #16  -g whitelist synced only 634 MB and skipped build/envsetup.sh,
      #        because repo skips projects that carry no groups attribute and
      #        the AERA replacements (android_build_make, ...) have none.
      #
      # So ask repo what it actually has, then only remove names that exist.
      - name: Generate prune manifest from repo's project list
        run: |
          cd "$SRC"
          repo list > /tmp/projects.txt 2>/dev/null || true
          echo "projects listed: $(wc -l < /tmp/projects.txt)"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<manifest>'
            # a recovery image never links against any of these
            for path in cts/ test/vts test/vti test/suite_harness \
                        developers/build developers/samples development \
                        tools/tradefederation tools/apksig tools/loganalysis \
                        tools/metalava tools/netsim tools/deviceinfra \
                        sdk/ ndk/ pdk/ \
                        prebuilts/clang/host/darwin-x86 \
                        prebuilts/go/darwin-x86 \
                        prebuilts/rust \
                        prebuilts/gradle-plugin \
                        prebuilts/bundletool \
                        prebuilts/vndk/v30 prebuilts/vndk/v31 \
                        prebuilts/vndk/v32 prebuilts/vndk/v33 \
                        prebuilts/vndk/v34 \
                        prebuilts/android-emulator \
                        prebuilts/qemu-kernel \
                        kernel/prebuilts/mainline; do
              # only emit a removal for projects this manifest really defines
              if awk -v p="$path" 'index($1, p) == 1 && $1 == p {found=1} END{exit !found}' /tmp/projects.txt; then
                echo "  <remove-project path=\"$path\" />"
              fi
            done
            echo '</manifest>'
          } > .repo/local_manifests/02-prune.xml
          echo "--- generated prune ---"
          cat .repo/local_manifests/02-prune.xml
          cp -f .repo/local_manifests/02-prune.xml /tmp/localmanifests/ 2>/dev/null || true

      # The step must FAIL when repo sync fails: in run #1 the retry loop
      # swallowed the exit status and the tree was silently incomplete.
      - name: repo sync
        run: |
          cd "$SRC"
          set -o pipefail
          ok=0
          for i in 1 2 3; do
            echo "===== sync attempt $i (-j$SYNC_JOBS) ====="
            df -h / | tail -1
            df -i / | tail -1
            free -m | head -2
            repo sync -c -j"$SYNC_JOBS" 2>&1 | tee /tmp/sync.log
            rc=${PIPESTATUS[0]}
            echo "attempt $i -> exit $rc"
            if [ "$rc" -eq 0 ]; then ok=1; break; fi
            grep -m5 -E 'error:|fatal:|No space left' /tmp/sync.log \
              | sed 's/^/::error::sync: /' || true
            echo "::error::sync bytes: $(df -h / | tail -1)"
            echo "::error::sync inodes: $(df -i / | tail -1)"

            if grep -q 'Cannot initialize work tree' /tmp/sync.log && [ "$i" -eq 1 ]; then
              echo "work-tree init failure: retrying with partial clone"
              repo init --no-clone-bundle --partial-clone \
                --clone-filter=blob:limit=10M -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"
              mkdir -p .repo/local_manifests
              cp -f /tmp/localmanifests/*.xml .repo/local_manifests/ 2>/dev/null || true
              continue
            fi
            echo "retrying with a forced sync"
            repo sync -c --force-sync -j2 2>&1 | tee /tmp/sync2.log || true
            sleep 20
          done
          echo "===== sync summary ====="
          df -h / | tail -1
          du -sh "$SRC" 2>/dev/null || true
          du -sh "$SRC/.repo" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::repo sync failed after 3 attempts; last errors:"
            grep -m8 -E 'error|fatal|No space' /tmp/sync.log | sed 's/^/::error::/' || true
            exit 1
          fi
          test -f build/envsetup.sh || { echo "::error::incomplete tree: build/envsetup.sh missing"; exit 1; }
          test -d bionic               || { echo "::error::incomplete tree: bionic missing"; exit 1; }
          test -d build/soong          || { echo "::error::incomplete tree: build/soong missing"; exit 1; }

          # Run #17 synced successfully but left only 8 GB free of 145 GB:
          #   /build/source       112G
          #   /build/source/.repo  55G
          # The object store is reclaimed by its own later step, right before
          # the compile, so the overlay below still has room to run.
          echo "tree looks usable"

      # --------------------------------------------------------------- device
      - name: Overlay consolidated AERA sources and install device tree
        run: |
          cd "$SRC"
          rm -rf bootable/recovery external/lvgl vendor/recovery "$DEVICE_DIR"
          cp -a "$MONO/android_bootable_recovery" bootable/recovery
          cp -a "$MONO/android_external_lvgl" external/lvgl
          cp -a "$MONO/android_vendor_recovery" vendor/recovery
          mkdir -p "$(dirname "$DEVICE_DIR")"
          cp -a "$MONO/$DEVICE_DIR" "$DEVICE_DIR"
          echo "===== sanity ====="
          test -s "$DEVICE_DIR/prebuilt/kernel"                        && echo "kernel OK"
          test -f "$DEVICE_DIR/recovery/root/system/etc/recovery.fstab" && echo "fstab OK"
          test -d "$DEVICE_DIR/recovery/root/vendor/lib64"             && echo "vendor blobs OK"
          test -f bootable/recovery/AERA_A16.sh                        && echo "recovery source OK"
          test -f vendor/recovery/AERA_A16.sh                          && echo "vendor/recovery OK"
          test -f external/lvgl/lvgl.h                                 && echo "lvgl OK"
          df -h / | tail -1

          # envsetup.sh and the build scripts shell out to git here. Without a
          # .git they print "fatal: not a git repository"; with an EMPTY .git
          # they print "fatal: your current branch 'master' does not have any
          # commits yet" (run #19) and envsetup still lands in
          # "dependencies-only mode on a non-existing device tree". A single
          # empty commit makes every rev-parse/describe lookup succeed.
          for d in bootable/recovery external/lvgl vendor/recovery "$DEVICE_DIR"; do
            if [ -d "$d" ] && [ ! -e "$d/.git" ]; then
              git -C "$d" init -q 2>/dev/null || true
              git -C "$d" -c user.name=ci -c user.email=ci@local \
                commit -q --allow-empty -m overlay 2>/dev/null || true
            fi
          done
          git -C bootable/recovery rev-parse --short HEAD 2>&1 | head -1

      # ---------------------------------------------------------------- build
      # Run #17 reached the compile for the first time and was killed with
      # exit 143 (SIGTERM) after five minutes:
      #   [watchdog 13:33:58] root=6.6G mem=6935MB avail
      #   [watchdog 13:35:58] root=6.4G mem=1251MB avail
      # Two constraints at once: only ~7 GB left on disk (out/ needs tens of
      # GB) and the runner's 16 GB RAM collapsing under parallel soong/ninja.
      #
      # 1) Reclaim disk: .repo was 55 GB of the 112 GB tree and the build never
      #    reads it after checkout.
      # 2) Bound the scheduler: 4 vCPU / 16 GB cannot run the default job count
      #    for soong + ninja without thrashing. Cap both and enlarge swap.
      - name: Reclaim disk and set up swap before compiling
        run: |
          cd "$SRC"
          echo "=== before reclaim ==="
          df -h /
          du -sh .repo 2>/dev/null || true
          rm -rf .repo/project-objects .repo/projects
          find .repo -maxdepth 3 -type d -name objects -exec rm -rf {} + 2>/dev/null || true
          echo "=== after reclaim ==="
          df -h /
          du -sh .repo 2>/dev/null || true
          # Swap: soong_build alone (a large Go binary) peaks well past the
          # memory left after the tree is checked out. Run #19 was killed at
          # 99% of the soong bootstrap with mem=936MB.
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build AERA recovery
        run: |
          cd "$SRC"
          export TMPDIR=/build/tmp
          mkdir -p "$TMPDIR"
          # Do NOT pipe mka into tail. Runs #17 and #18 both died with exit 143
          # (SIGTERM) while disk (61G free), memory (7.1G) and swap (2.9G) were
          # all healthy, and piped output hid every progress line until exit.
          # Log to a file, stream progress from the watchdog, print the tail at
          # the end.
          source build/envsetup.sh
          lunch "$LUNCH_TARGET"
          get_build_var TARGET_PRODUCT || true
          get_build_var TARGET_BUILD_VARIANT || true
          # Job count. Run #19 got to 99% of the soong bootstrap and was killed
          # with only 936 MB of RAM left, so -j4 on a 4 vCPU / 16 GB runner is
          # still too wide. Two concurrent compile jobs plus a 16 GB swap file
          # is the shape that fits this machine.
          export SOONG_UI_JOB_LIMIT=2
          set +e
          mka -j2 adbd recoveryimage > /build/build.log 2>&1 &
          BUILD_PID=$!
          (
            while kill -0 "$BUILD_PID" 2>/dev/null; do
              sleep 60
              echo "[watchdog $(date -u +%T)] disk=$(df -h / | awk 'NR==2{print $4}') mem=$(free -m | awk '/Mem:/{print $7"MB avail"}') swap=$(free -m | awk '/Swap:/{print $4"MB free"}') out=$(du -sh "$SRC/out" 2>/dev/null | cut -f1)"
              tail -2 /build/build.log
            done
          ) &
          WD=$!
          wait "$BUILD_PID"
          rc=$?
          kill "$WD" 2>/dev/null || true
          set -e
          echo "===== last 200 lines of the build log ====="
          tail -200 /build/build.log
          echo "[final] rc=$rc disk=$(df -h / | awk 'NR==2{print $4}') mem=$(free -m | awk '/Mem:/{print $7"MB avail"}')"
          exit $rc

      # ------------------------------------------------------------ artefacts
      - name: Collect artefacts
        if: always()
        run: |
          mkdir -p artefacts
          OUT="$SRC/out/target/product/m2461"
          cp -v "$OUT/recovery.img" artefacts/ 2>/dev/null || true
          cp -v "$OUT/adbd" artefacts/ 2>/dev/null || true
          ls -la artefacts || true
          if [ -f artefacts/recovery.img ]; then
            sha256sum artefacts/recovery.img > artefacts/recovery.img.sha256
            du -h artefacts/recovery.img
          fi

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-image-${{ github.run_number }}
          path: artefacts/
          retention-days: 30

      # Always keep the full mka log, not just the 200-line tail: the API can
      # only download logs after the job ends, and an artifact survives even
      # when the runner is killed.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /build/build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Create prerelease
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          name: AERA-m2461-${{ github.run_number }}
          tag_name: aera-m2461-${{ github.run_number }}
          prerelease: true
          files: |
            artefacts/recovery.img
            artefacts/recovery.img.sha256
          body: |
            AERA Recovery R1.0 (aera-16.0) for Meizu 21 (m2461)

            - manifest: this repo (main), chain default.xml -> twrp-default.xml -> aera.xml
            - device tree commit: `${{ github.sha }}`
            - kernel: stock M2461 `Image` (6.1.25-android14-11-maybe-dirty)

            Flash:
            ```
            fastboot flash recovery_a recovery.img
            fastboot flash recovery_b recovery.img
            ```
